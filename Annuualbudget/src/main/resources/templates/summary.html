<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Summary - Budget Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="container py-4">
    <nav class="nav nav-tabs mb-4">
        <a class="nav-link" href="/setup">Setup</a>
        <a class="nav-link" href="/income">Income</a>
        <a class="nav-link" href="/expenses">Expenses</a>
        <a class="nav-link active" href="/summary">Summary</a>
    </nav>
    <h2 th:text="${currentYear} + ' Annual Budget Summary'"></h2>
    <p class="text-muted">This sheet generates a summary of your spending based on data in the Expenses and Income tabs.</p>

    <div class="card p-4 my-4 shadow-sm">
        <h5 class="card-title mb-3">収支推移・資産残高グラフ</h5>
        <div style="position: relative; height:350px; width:100%">
            <canvas id="budgetChart"></canvas>
        </div>
    </div>

    <table class="table table-bordered mt-4 text-center">
        <thead class="table-dark">
            <tr>
                <th>Item</th>
                <th th:each="m : ${months}" th:text="${m.month} + '月'"></th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="fw-bold text-start">Income</td>
                <td th:each="m : ${months}" th:text="${m.income}" class="income-data"></td>
                <td class="fw-bold" th:text="${totalIncome}"></td>
            </tr>
            <tr>
                <td class="fw-bold text-start">Expenses</td>
                <td th:each="m : ${months}" th:text="${m.expense}" class="expense-data"></td>
                <td class="fw-bold" th:text="${totalExpense}"></td>
            </tr>
            <tr class="table-light">
                <td class="fw-bold text-start">Net savings</td>
                <td th:each="m : ${months}" th:text="${m.netSavings}" th:classappend="${m.netSavings &lt; 0} ? 'text-danger' : 'text-success'"></td>
                <td class="fw-bold" th:text="${totalIncome - totalExpense}"></td>
            </tr>
            <tr class="table-info">
                <td class="fw-bold text-start">Ending balance</td>
                <td th:each="m : ${months}" th:text="${m.endingBalance}" class="balance-data"></td>
                <td class="fw-bold">-</td>
            </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // テーブル内の各月の数値要素を取得
            const incomeElements = document.querySelectorAll('.income-data');
            const expenseElements = document.querySelectorAll('.expense-data');
            const balanceElements = document.querySelectorAll('.balance-data'); // ✨追加

            // テキストから数値の配列に変換
            const incomeData = Array.from(incomeElements).map(el => parseFloat(el.textContent) || 0);
            const expenseData = Array.from(expenseElements).map(el => parseFloat(el.textContent) || 0);
            const balanceData = Array.from(balanceElements).map(el => parseFloat(el.textContent) || 0); // ✨追加
            
            // 1月〜12月のラベル定義
            const labels = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

            // グラフの設定と描画開始
            const ctx = document.getElementById('budgetChart').getContext('2d');
            new Chart(ctx, {
                data: {
                    labels: labels,
                    datasets: [
                        
                        {
                            type: 'bar', // 棒グラフ
                            label: '収入 (Income)',
                            data: incomeData,
                            backgroundColor: 'rgba(40, 167, 69, 0.6)', // グリーン
                            borderColor: 'rgb(40, 167, 69)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            type: 'bar', // 棒グラフ
                            label: '支出 (Expenses)',
                            data: expenseData,
                            backgroundColor: 'rgba(220, 53, 69, 0.6)', // レッド
                            borderColor: 'rgb(220, 53, 69)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
						{
                            // ✨ Ending balance を折れ線グラフ（line）として追加
                            type: 'line',
                            label: '最終残高 (Ending balance)',
                            data: balanceData,
                            borderColor: 'rgb(54, 162, 235)', // 鮮やかなブルー
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            borderWidth: 3,
                            tension: 0.1, // 線の少し丸みを持たせる設定
                            fill: false,
                            yAxisID: 'y' // 左側の軸を使用
                        },
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
