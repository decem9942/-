<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Setup - Budget Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <nav class="nav nav-tabs mb-4">
        <a class="nav-link active" href="/setup">Setup</a>
        <a class="nav-link" href="/income">Expenses</a>
        <a class="nav-link" href="/expenses">Income</a>
        <a class="nav-link" href="/summary">Summary</a>
    </nav>
    <h2>1. Configure </h2>
    <div class="card p-4 mt-3" style="max-width: 400px;">
        <form th:action="@{/setup}" method="post">
            <div class="mb-3">
                <label for="startingBalance" class="form-label">Starting balance:</label>
                <input type="number" step="0.01" class="form-control" id="startingBalance" name="startingBalance" th:value="${setup.startingBalance}" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Balance</button>
        </form>
    </div>
</body>
</html>
