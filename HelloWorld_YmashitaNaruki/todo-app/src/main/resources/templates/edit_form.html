<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #222;
        }
        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #0d6efd;
            outline: none;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-container {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: inline-block;
        }
        .btn-submit {
            background-color: #0d6efd;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
        }
        .btn-cancel {
            background-color: #6c757d;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>タスク編集</h1>
        
        <!-- 更新リクエスト。コントローラーの更新メソッドにマッピング -->
        <form th:action="@{/edit/update}" th:object="${task}" method="post">
            <!-- どのタスクを更新するかを識別するためIDを送信 -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" th:field="*{title}" required />
            </div>

            <div class="form-group">
                <label for="content">内容</label>
                <textarea th:field="*{content}" required></textarea>
            </div>

            <div class="form-group">
                <label for="name">登録者</label>
                <input type="text" th:field="*{name}" required />
            </div>

            <div class="form-group">
                <label for="startDate">開始日</label>
                <input type="date" th:field="*{startDate}" required />
            </div>

            <div class="form-group">
                <label for="endDate">終了日</label>
                <input type="date" th:field="*{endDate}" required />
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-submit">更新</button>
                <!-- キャンセルしたらタスク一覧（/tasks）に戻す -->
                <a th:href="@{/tasks}" class="btn btn-cancel">← キャンセル</a>
            </div>
        </form>
    </div>

</body>
</html>
